name: ZAP Baseline Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Start Juice Shop
        run: docker compose up -d juice-shop
      - name: Wait for Juice Shop
        run: timeout 120 bash -c 'until curl -sf http://localhost:3000 > /dev/null; do sleep 3; done'
      - name: Run ZAP baseline scan
        run: |
          mkdir -p reports
          chmod 777 reports
          docker compose run --rm zap
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: zap-report
          path: reports/
          retention-days: 30