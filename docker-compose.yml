services:
  juice-shop:
    image: bkimminich/juice-shop
    container_name: juice-shop
    ports:
      - "127.0.0.1:3000:3000"

  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    profiles: ["scan"]
    depends_on:
      - juice-shop
    volumes:
      - ./reports:/zap/wrk:rw
      - ./zap:/zap/config:ro
    command: zap-baseline.py -t http://juice-shop:3000 -c /zap/config/rules.conf -r report.html -J report.json -I